org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9: keep the legacy DSL and the separately applied Kotlin Gradle Plugin
# until Flutter and its plugins finish migrating (docs.flutter.dev
# "Migrating to AGP 9" / "built-in Kotlin"). Flutter's migrator would add
# these on first build anyway; committing them keeps CI checkouts unchanged.
android.newDsl=false
android.builtInKotlin=false
kotlin.code.style=official
